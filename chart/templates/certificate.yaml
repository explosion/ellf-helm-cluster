{{- if .Values.certManager }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ingress.tls.secretName }}
spec:
  secretName: {{ .Values.ingress.tls.secretName }}
  issuerRef:
    name: {{ include "ellf.clusterIssuerName" . }}
    kind: ClusterIssuer
  dnsNames:
    - {{ include "ellf.brokerHostname" . }}
{{- end }}
