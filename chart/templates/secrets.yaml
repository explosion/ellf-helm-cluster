apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ellf.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ellf.labels" . | nindent 4 }}
type: Opaque
stringData:
  ELLF_CONTAINER_SA_KEY: {{ .Values.secrets.containerSaKey | quote }}
  ELLF_PRODIGY_LICENSE_KEY: {{ .Values.secrets.prodigyLicenseKey | quote }}
  {{- if .Values.secrets.mediaSigningKey }}
  # Shared by the broker (mints media URL tokens) and the preview nginx pod
  # (verifies them via secure_link). Setting this enables the media server.
  ELLF_MEDIA_SIGNING_KEY: {{ .Values.secrets.mediaSigningKey | quote }}
  {{- end }}
{{- if and .Values.local (not .Values.secrets.infraSecretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ellf.infraSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ellf.labels" . | nindent 4 }}
type: Opaque
stringData:
  ELLF_DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
  ELLF_PRIVATE_KEY: {{ .Values.secrets.privateKey | quote }}
  {{- if .Values.secrets.publicKey }}
  ELLF_PUBLIC_KEY: {{ .Values.secrets.publicKey | quote }}
  {{- end }}
{{- end }}
