apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ellf.fullname" . }}-test-db-connectivity
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ellf.labels" . | nindent 4 }}
    app: test-db-connectivity
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with .Values.broker.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.broker.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: db-check
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          {{- if .Values.postgresql.enabled }}  {{/* subchart — keep .enabled */}}
          nc -z -w 5 {{ printf "%s-postgresql" (include "ellf.fullname" .) | quote }} 5432
          {{- else }}
          nc -z -w 5 {{ .Values.database.ip | quote }} 5432
          {{- end }}
          echo "Database connectivity check passed"
