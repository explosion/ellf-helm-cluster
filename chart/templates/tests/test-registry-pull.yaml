apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ellf.fullname" . }}-test-registry-pull
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ellf.labels" . | nindent 4 }}
    app: test-registry-pull
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.broker.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.broker.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: pull-check
      image: {{ printf "%s/broker:%s" (include "ellf.upstreamRegistry" .) (include "ellf.brokerVersion" .) }}
      imagePullPolicy: Always
      command:
        - /bin/sh
        - -c
        - echo "Registry pull check passed"
