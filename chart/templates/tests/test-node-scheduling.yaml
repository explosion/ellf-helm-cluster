apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ellf.fullname" . }}-test-node-scheduling
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ellf.labels" . | nindent 4 }}
    app: test-node-scheduling
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with .Values.broker.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.broker.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: schedule-check
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - echo "Node scheduling check passed"
