apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ellf.fullname" . }}
  labels:
    {{- include "ellf.labels" . | nindent 4 }}
rules:
  # Broker reads cluster nodes for capacity/utilization reporting.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ellf.fullname" . }}
  labels:
    {{- include "ellf.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ellf.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ellf.fullname" . }}
    namespace: {{ .Release.Namespace }}
