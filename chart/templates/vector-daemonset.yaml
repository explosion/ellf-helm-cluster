{{- if and .Values.logging .Values.logging.vector }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ellf.fullname" . }}-vector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ellf.labels" . | nindent 4 }}
    app: vector
spec:
  selector:
    matchLabels:
      app: vector
      app.kubernetes.io/name: {{ include "ellf.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: vector
        app.kubernetes.io/name: {{ include "ellf.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/vector-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "ellf.fullname" . }}
      tolerations:
        - operator: Exists
      containers:
        - name: vector
          image: {{ .Values.logging.vector.image }}
          args:
            - --config-dir
            - /etc/vector/
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/vector/
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
          {{- with .Values.logging.vector.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "ellf.fullname" . }}-vector
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: data
          hostPath:
            path: /var/lib/vector
            type: DirectoryOrCreate
{{- end }}
