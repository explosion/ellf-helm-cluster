{{- if .Values.preview.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ellf.previewName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ellf.labels" . | nindent 4 }}
    app: preview
spec:
  type: ClusterIP
  selector:
    {{- include "ellf.previewSelectorLabels" . | nindent 4 }}
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
{{- end }}
