apiVersion: v1
kind: Service
metadata:
  name: {{ include "ellf.brokerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ellf.labels" . | nindent 4 }}
    app: broker
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    {{- include "ellf.selectorLabels" . | nindent 4 }}
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq (.Values.service.type | default "ClusterIP") "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
