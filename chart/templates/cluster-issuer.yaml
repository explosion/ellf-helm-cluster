{{- if .Values.certManager }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ include "ellf.clusterIssuerName" . }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.certManager.acmeEmail }}
    privateKeySecretRef:
      name: {{ include "ellf.clusterIssuerAccountSecretName" . }}
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ include "ellf.ingressClassName" . }}
{{- end }}
